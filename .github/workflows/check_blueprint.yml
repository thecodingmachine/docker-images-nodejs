name: Check generated files

on:
  pull_request:
  push:

jobs:
  check_blueprint:
    runs-on: ubuntu-latest
    name: Check that the Dockerfiles are generated from the blueprint
    steps:
      - uses: actions/checkout@v7
      - name: Install orbit
        run: |
          ORBIT_VERSION=3.3.0
          cd "$(mktemp -d)"
          curl -fsSLO --retry 5 --retry-delay 2 "https://github.com/gulien/orbit/releases/download/v${ORBIT_VERSION}/orbit_Linux_x86_64.tar.gz"
          curl -fsSLO --retry 5 --retry-delay 2 "https://github.com/gulien/orbit/releases/download/v${ORBIT_VERSION}/Orbit_${ORBIT_VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "Orbit_${ORBIT_VERSION}_checksums.txt"
          tar -xzf orbit_Linux_x86_64.tar.gz orbit
          sudo install orbit /usr/local/bin/orbit
      - name: Regenerate the Dockerfiles
        run: make blueprint
      - name: Check that nothing changed
        run: |
          if ! git diff --quiet; then
            echo "::error::The Dockerfiles are not up to date with utils/Dockerfile.blueprint, run 'make blueprint'"
            git diff
            exit 1
          fi
